[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairkit"
version = "0.1.0"
description = "A cross-dataset fairness benchmarking and bias-mitigation toolkit for recidivism-style classification tasks."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = ["click>=8.0"]

[project.scripts]
fairkit = "fairkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
